<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vital Noval Fitness Home | Health education, fitness programs and active play</title>
<meta name="description" content="Plain-language health education, gentle home remedies, weekly fitness programs and sports with real health benefits.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Lora:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f7f1e3;
  --surface: #fffaf0;
  --ink: #1f2a22;
  --muted: #50594f;
  --forest: #2f5d43;
  --mint: #e5ebd7;
  --sun: #b8902f;
  --sun-dark: #856719;
  --sky: #7a2e3a;
  --line: #cfc09a;
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Lora", Georgia, "Times New Roman", serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16201a;
    --surface: #1e2b22;
    --ink: #f1ead6;
    --muted: #c6c4b1;
    --forest: #8cc9a0;
    --mint: #263629;
    --sun: #d9b45a;
    --sun-dark: #e8c873;
    --sky: #d98c98;
    --line: #46533f;
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 5.5rem;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 20% 0, rgba(184, 144, 47, 0.08), transparent 40%),
    var(--bg);
  color: var(--ink);
  font: 400 1.0625rem/1.65 var(--body);
  text-rendering: optimizeLegibility;
}

a {
  color: inherit;
  text-decoration-thickness: 0.12em;
  text-underline-offset: 0.18em;
}

:focus-visible {
  outline: 3px solid var(--sun);
  outline-offset: 4px;
  border-radius: 4px;
}

.skip-link {
  position: fixed;
  top: 0.75rem;
  left: 0.75rem;
  z-index: 100;
  padding: 0.65rem 1rem;
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--ink);
  transform: translateY(-180%);
  transition: transform 160ms ease;
}

.skip-link:focus {
  transform: translateY(0);
}

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-inline: clamp(1rem, 4vw, 1.25rem);
}

h1,
h2,
h3 {
  font-family: var(--display);
  line-height: 1.1;
  margin: 0;
  letter-spacing: 0;
  font-weight: 800;
  text-wrap: balance;
}

h1 {
  font-size: clamp(2.6rem, 8vw, 5.2rem);
  max-width: 14ch;
}

h2 {
  font-size: clamp(1.9rem, 4.5vw, 2.75rem);
}

h3 {
  font-size: 1.25rem;
  font-weight: 600;
}

p {
  margin: 0;
}

.lead,
.card p,
.fact span,
.remedy .see,
.day span {
  color: var(--muted);
}

.lead {
  max-width: 60ch;
  margin-top: 0.75rem;
}

/* Notice */
.notice {
  background: var(--ink);
  color: var(--bg);
  font-size: 0.9rem;
  text-align: center;
  padding: 0.6rem 1rem;
}

.notice b {
  color: var(--sun);
}

@media (prefers-color-scheme: dark) {
  .notice b {
    color: var(--sun-dark);
  }
}

/* Navigation */
header.nav {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.nav .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 3.75rem;
  flex-wrap: wrap;
  padding-block: 0.5rem;
}

.brand {
  font: 800 1.15rem var(--display);
  text-decoration: none;
  letter-spacing: -0.02em;
}

.brand span {
  color: var(--forest);
}

nav ul {
  display: flex;
  gap: clamp(0.75rem, 2vw, 1.25rem);
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 0.95rem;
  font-weight: 500;
  flex-wrap: wrap;
}

nav a {
  display: inline-block;
  padding-block: 0.35rem;
  text-decoration: none;
  color: var(--muted);
}

nav a:hover {
  color: var(--ink);
  text-decoration: underline;
}

/* Hero */
.hero {
  padding: clamp(3rem, 8vw, 6rem) 0 3rem;
}

.hero p {
  font-size: 1.2rem;
  color: var(--muted);
  max-width: 52ch;
  margin-top: 1.25rem;
}

.btns {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-top: 1.75rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  padding: 0.85rem 1.4rem;
  border-radius: 999px;
  font-weight: 700;
  text-decoration: none;
  border: 2px solid var(--ink);
  transition: transform 160ms ease, box-shadow 160ms ease;
}

.btn.primary {
  background: var(--sun);
  border-color: var(--sun-dark);
  color: #10291b;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgb(31 42 34 / 16%);
}

.pulse {
  width: 100%;
  height: 90px;
  margin-top: 2.5rem;
  display: block;
}

.pulse path {
  fill: none;
  stroke: var(--forest);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1400;
  stroke-dashoffset: 1400;
  animation: draw 2.6s ease-out forwards;
}

@keyframes draw {
  to { stroke-dashoffset: 0; }
}

/* Shared sections */
section {
  position: relative;
  padding: clamp(3rem, 7vw, 5rem) 0;
  border-top: 1px solid var(--sun);
}

section::before {
  content: "❦";
  position: absolute;
  left: 50%;
  top: -1.05rem;
  transform: translateX(-50%);
  background: var(--bg);
  padding: 0 1rem;
  color: var(--sun);
  font-size: 1.1rem;
}

.grid {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
  margin-top: 2rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: clamp(1.1rem, 3vw, 1.4rem);
  box-shadow: 0 3px 12px rgb(31 42 34 / 5%);
}

.card p {
  margin-top: 0.5rem;
  font-size: 1rem;
}

.card .tag {
  display: inline-block;
  margin-top: 0.9rem;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--forest);
  background: var(--mint);
  padding: 0.25rem 0.65rem;
  border-radius: 999px;
}

/* Facts */
.facts {
  display: grid;
  gap: 1.25rem;
  grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
  margin-top: 2rem;
}

.fact {
  border-left: 4px solid var(--sun);
  padding-left: 1rem;
}

.fact strong {
  display: block;
  font: 800 2rem var(--display);
  color: var(--forest);
}

.fact span {
  font-size: 0.98rem;
}

/* Remedies */
.remedy h3 {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  align-items: baseline;
}

.remedy .see {
  margin-top: 0.9rem;
  padding-top: 0.75rem;
  border-top: 1px dashed var(--line);
  font-size: 0.92rem;
}

.remedy .see b {
  color: var(--ink);
}

/* Programs */
.tabs {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 2rem;
}

.tabs button {
  min-height: 44px;
  font: 700 1rem var(--body);
  padding: 0.65rem 1.2rem;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}

.tabs button:hover {
  border-color: var(--forest);
}

.tabs button[aria-selected="true"] {
  background: var(--forest);
  border-color: var(--forest);
  color: var(--bg);
}

@media (prefers-color-scheme: dark) {
  .tabs button[aria-selected="true"] {
    color: #0f1d15;
  }
}

.plan {
  margin-top: 1.25rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}

.plan .sum {
  padding: 1.25rem 1.4rem;
  background: var(--mint);
}

.plan .sum p {
  color: var(--ink);
  margin-top: 0.25rem;
}

.day {
  display: grid;
  grid-template-columns: 5.5rem 1fr;
  gap: 1rem;
  padding: 0.95rem 1.4rem;
  border-top: 1px solid var(--line);
}

.day b {
  font-family: var(--display);
}

.day span {
  color: var(--muted);
}

/* Sports */
.sport {
  display: flex;
  flex-direction: column;
}

.sport .ic {
  font-size: 2rem;
  line-height: 1;
}

.sport h3 {
  margin-top: 0.6rem;
}

/* Footer */
footer {
  background: var(--ink);
  color: var(--bg);
  padding: 3rem 0 2.5rem;
  margin-top: 2rem;
}

footer p {
  color: #c5d6c9;
  font-size: 0.95rem;
  max-width: 70ch;
  margin-top: 0.75rem;
}

footer h3 {
  color: var(--bg);
}

footer .src a {
  color: var(--sun);
  text-decoration: underline;
}

@media (max-width: 560px) {
  .nav .wrap {
    align-items: flex-start;
  }

  nav ul {
    width: 100%;
  }

  .day {
    grid-template-columns: 1fr;
    gap: 0.15rem;
  }

  .hero p,
  .lead,
  footer p {
    max-width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  .pulse path {
    animation: none;
    stroke-dashoffset: 0;
  }

  .btn:hover {
    transform: none;
  }
}

@media (forced-colors: active) {
  .btn,
  .tabs button,
  .card,
  .plan {
    border: 1px solid CanvasText;
  }

  :focus-visible {
    outline: 3px solid Highlight;
  }
}

@media print {
  header.nav,
  .notice,
  .btns {
    display: none;
  }

  body {
    background: #fff;
    color: #000;
  }

  section,
  .card,
  .plan {
    break-inside: avoid;
  }
}
</style>
</head>
